# Copy to config.yaml and edit. Everything here has a sensible default;
# CLI flags override config values, which override defaults.

owner_name: "Isaiah"        # you — no profile is built for the owner

whisper:
  model: large-v3           # tiny/base/small/medium/large-v3; large-v3 = best accuracy
  compute_type: int8        # int8 on Apple Silicon CPU; float16 on NVIDIA GPU
  language: en              # null to auto-detect
  backend: faster-whisper   # transcription backend (swappable seam)

transcript:
  timestamps: true          # prefix each turn with [HH:MM:SS]
  min_segment_duration: 0.4 # drop ultra-short segments (cross-track bleed filter)
  merge_gap_seconds: 1.5    # collapse same-speaker segments within this gap into one turn

summarize:
  enabled: true             # requires ANTHROPIC_API_KEY; --no-summary disables per run
  model: claude-sonnet-5    # or claude-opus-4-8 for higher quality
  max_tokens: 4096

email:
  enabled: false            # true = email the summary after every run (or use --email)
  smtp_host: smtp.gmail.com
  smtp_port: 587
  from: "you@gmail.com"     # sender; app password goes in .env as GMAIL_APP_PASSWORD
  to: []                    # recipients; empty list = send to yourself
  send_to_participants: false  # true = email each matched participant their reflection
                               # (leave false to review drafts in output/<call>/reflections/)

reflections:
  enabled: false            # generate a personal reflection per participant
                            # (threads to bring to their counsellor, patterns, etc.)

contacts_file: ./contacts.yaml  # participant name -> email (see contacts.example.yaml)

speakers: {}                # optional overrides keyed by filename stem,
                            # e.g. audio1234: "Isaiah"

# Tags written into each call's manifest.json (the integration point for a
# downstream quote/marketing database). A tag is applied when any of its
# phrases appears in the Zoom topic or the composed call title.
tags:
  expedition: ["expedition", "where we dropping", "intro call", "onboarding"]
  squad: ["squad"]
  one-on-one: ["1:1", "one on one"]

paths:
  output_dir: ./output
  profiles_dir: ./profiles
