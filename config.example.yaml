# Copy to config.yaml and edit. Everything here has a sensible default;
# CLI flags override config values, which override defaults.

owner_name: "Isaiah"        # you — no profile is built for the owner

whisper:
  model: large-v3           # tiny/base/small/medium/large-v3; large-v3 = best accuracy
  compute_type: int8        # int8 on Apple Silicon CPU; float16 on NVIDIA GPU
  language: en              # null to auto-detect
  backend: faster-whisper   # transcription backend (swappable seam)

transcript:
  timestamps: true          # prefix each line with [HH:MM:SS]
  min_segment_duration: 0.4 # drop ultra-short segments (cross-track bleed filter;
                            # auto-disabled when there's only one audio source)
  merge_gap_seconds: 1.5    # collapse same-speaker segments within this gap into one turn
  granularity: turn         # turn = one line per speaker turn;
                            # sentence = one timestamped line per sentence
  speaker_labels: true      # false = "[00:01:05] text" with no speaker name

summarize:
  enabled: true             # requires ANTHROPIC_API_KEY; --no-summary disables per run
  model: claude-sonnet-5    # or claude-opus-4-8 for higher quality
  max_tokens: 4096

email:
  enabled: false            # true = email the summary after every run (or use --email)
  smtp_host: smtp.gmail.com
  smtp_port: 587
  from: "you@gmail.com"     # sender; app password goes in .env as GMAIL_APP_PASSWORD
  to: []                    # recipients; empty list = send to yourself.
                            # KEEP THIS AS YOURSELF ONLY: the summary email includes the
                            # facilitator-only "Facilitator signal" section. Participants
                            # get their own emails (send_to_participants) with it stripped.
  send_to_participants: false  # true = email each matched participant their reflection
                               # (leave false to review drafts in output/<call>/reflections/)

reflections:
  enabled: false            # generate a personal reflection per participant
                            # (threads to bring to their counsellor, patterns, etc.)

contacts_file: ./contacts.yaml  # participant name -> email (see contacts.example.yaml)

speakers: {}                # optional overrides keyed by filename stem,
                            # e.g. audio1234: "Isaiah"

# Tags written into each call's manifest.json (the integration point for a
# downstream quote/marketing database). A tag is applied when any of its
# phrases appears in the Zoom topic or the composed call title.
tags:
  expedition: ["expedition", "where we dropping", "intro call", "onboarding"]
  squad: ["squad"]
  one-on-one: ["1:1", "one on one"]

paths:
  output_dir: ./output
  profiles_dir: ./profiles

  # Set these two and the batch scripts and web page need no arguments —
  # `bash scripts/transcribe_folder.sh` with nothing after it just works.
  # config.yaml is gitignored, so your folder names never reach GitHub.
  recordings_dir: ""    # e.g. ~/Documents/CASTLE BLINDS/Raw Voice Memos
  transcripts_dir: ""   # e.g. ~/Documents/CASTLE BLINDS/Timestamped Transcribed Memos

# Several bodies of work, one tool. Each project has its own folders and cast;
# anything a project leaves out falls back to paths:/whisperx: above.
# Pick one per run with -p:  bash scripts/transcribe_folder.sh -p interviews
default_project: castle
projects:
  castle:
    recordings_dir:  ~/Documents/CASTLE BLINDS/Raw Voice Memos
    transcripts_dir: ~/Documents/CASTLE BLINDS/Timestamped Transcribed Memos
    speaker_names:   ["Dad", "Isaiah"]
  interviews:
    recordings_dir:  ~/Documents/Interviews/raw
    transcripts_dir: ~/Documents/Interviews/transcripts
    speaker_names:   ["Isaiah", "Guest"]
    num_speakers:    2

# The WhisperX path: one mixed recording -> speaker-labeled transcript.
# Used by scripts/transcribe_folder_whisperx.sh and the web page.
whisperx:
  venv: ~/Documents/whisperx-tool/.venv   # its own virtualenv, separate from this repo's
  model: large-v3
  num_speakers: 2                          # how many people are in the recordings
  speaker_names: []                        # most talkative FIRST, e.g. ["Dad", "Isaiah"]
